name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    name: Montar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Páginas do site em dia com os modelos
        run: |
          npm run gerar-site
          git diff --exit-code -- landing
      - name: Verificar links e testar o build
        run: |
          npm run verificar-site:offline
          npm run test:qr
          npm run test:pages
      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Montar o site estático
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Endereço público do aplicativo (servidor do ERASÓ), quando existir:
          # Settings > Secrets and variables > Actions > Variables > ERASO_APP_URL
          ERASO_APP_URL: ${{ vars.ERASO_APP_URL }}
        run: node scripts/build-pages.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
