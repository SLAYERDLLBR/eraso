# Serviço de presença e sinalização do ERASÓ na Cloudflare (plano gratuito).
# Publicar: veja cloudflare/README.md.
name = "eraso-sinal"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Sites que podem usar este serviço (lista separada por vírgulas): o GitHub Pages e a Cloudflare Pages.
ALLOWED_ORIGINS = "https://slayerdllbr.github.io,https://eraso.pages.dev"
# Endereço do aplicativo, mostrado na página inicial do serviço (quem abre o endereço no navegador).
APP_URL = "https://slayerdllbr.github.io/eraso/app/index.html"
# STUN usado pelos navegadores para descobrir o próprio endereço (padrão: stun.cloudflare.com).
# Para TURN (opcional), defina os segredos TURN_URL, TURN_USER e TURN_CRED com `npx wrangler secret put`.

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]
