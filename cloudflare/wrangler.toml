# Serviço de presença e sinalização do ERASÓ na Cloudflare (plano gratuito).
# Publicar: veja cloudflare/README.md.
name = "eraso-sinal"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Sites que podem usar este serviço (lista separada por vírgulas). Só o endereço do site publicado.
ALLOWED_ORIGINS = "https://slayerdllbr.github.io"
# STUN usado pelos navegadores para descobrir o próprio endereço (padrão: stun.cloudflare.com).
# Para TURN (opcional), defina os segredos TURN_URL, TURN_USER e TURN_CRED com `npx wrangler secret put`.

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]
